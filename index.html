<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrier Fantasy Freight 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080d12;--panel:#101820;--panel2:#161f28;--panel3:#1e2a35;--line:#29394a;--text:#eef2f6;--dim:#8fa0b0;--accent:#ffb020;--adim:#7a5a1f;--good:#3fcf8e;--goodbg:#112a20;--warn:#f2c14e;--warnbg:#2a2310;--bad:#ef5c73;--badbg:#2a1018;--r:10px;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.brand img{width:44px;height:44px;object-fit:contain;}
.brand h1{font-family:'Oswald',sans-serif;font-size:22px;margin:0;text-transform:uppercase;letter-spacing:.5px;}
.brand .sub{color:var(--dim);font-size:12px;margin-top:1px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px;}
.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;background:var(--accent);color:#1a1206;border:none;border-radius:8px;padding:10px 18px;cursor:pointer;transition:background .15s;}
.btn:hover{background:#ffc250;}
.btn:disabled{background:var(--panel3);color:var(--dim);cursor:not-allowed;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:6px;}
.btn.lock{background:#1a2535;color:var(--warn);border:1px solid var(--warn);padding:4px 8px;font-size:11px;border-radius:5px;}
.btn.lock:hover{background:var(--warn);color:#1a1206;}
.btn.locked-state{background:var(--goodbg);color:var(--good);border:1px solid var(--good);padding:4px 8px;font-size:11px;border-radius:5px;cursor:default;}
select,input{font-family:'JetBrains Mono',monospace;font-size:14px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;width:100%;}
label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:5px;}
.row{display:flex;gap:10px;align-items:flex-end;margin-top:12px;}
/* Login */
.lw{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(ellipse at 50% 0%,#1a2a18 0%,#0a1a28 40%,#060a0e 100%);}
.lb{max-width:400px;width:100%;}
.ll{display:flex;flex-direction:column;align-items:center;margin-bottom:24px;}
.ll img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 4px 24px rgba(255,176,32,.4));}
.ll h1{font-family:'Oswald',sans-serif;font-size:26px;text-transform:uppercase;margin:12px 0 3px;letter-spacing:1px;}
.ll .sub{color:var(--dim);font-size:13px;}
.login-hint{font-size:11px;color:var(--dim);text-align:center;margin-top:12px;}
.login-continue{display:flex;justify-content:center;margin-top:14px;}
/* Weeks */
.wtabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.wt{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;width:52px;height:46px;display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  clip-path:polygon(0 0,100% 0,100% 68%,50% 100%,0 68%);cursor:pointer;padding-bottom:5px;position:relative;}
.wt.active{background:linear-gradient(160deg,var(--accent),#c97e0e);color:#1a1206;}
.wt.locked-wk{border-color:var(--good);color:var(--good);}
/* Reps */
.rl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px;margin-bottom:16px;}
.rc{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 11px;cursor:pointer;user-select:none;}
.rc:hover:not(.lk){border-color:var(--adim);}
.rc.ck{background:var(--goodbg);border-color:var(--good);}
.rc.lk{opacity:.4;cursor:not-allowed;text-decoration:line-through;}
.rc input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;}
.cnt{font-family:'Oswald',sans-serif;font-size:14px;margin-bottom:12px;}
.cnt.ok{color:var(--good);}.cnt.w{color:var(--warn);}
.fr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
/* Notices */
.notice{border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:13px;}
.notice.warn{background:var(--warnbg);border:1px solid var(--warn);color:var(--warn);}
.notice.bad{background:var(--badbg);border:1px solid var(--bad);color:var(--bad);}
.notice.good{background:var(--goodbg);border:1px solid var(--good);color:var(--good);}
.notice.info{background:var(--panel2);border:1px solid var(--adim);color:var(--accent);}
.notice.dim{background:var(--panel2);border:1px solid var(--line);color:var(--dim);}
/* Progress */
.pr{display:flex;gap:5px;flex-wrap:wrap;margin-top:14px;}
.pc{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;border:1px solid var(--line);}
.pc.full{background:var(--goodbg);color:var(--good);border-color:var(--good);}
.pc.partial{background:var(--warnbg);color:var(--warn);border-color:var(--warn);}
.pc.empty{background:var(--badbg);color:var(--bad);border-color:var(--bad);}
/* Synctag */
.st{font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 9px;border-radius:5px;display:inline-block;margin-top:5px;}
.st.ok{background:var(--goodbg);color:var(--good);}
.st.err{background:var(--badbg);color:var(--bad);}
.st.p{background:var(--warnbg);color:var(--warn);}
/* Topbar */
.tb{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.who{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:700;font-size:14px;}
.matchup{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px;margin-bottom:14px;font-family:'JetBrains Mono',monospace;}
.matchup b{color:var(--text);}.vs{color:var(--accent);font-weight:700;}
/* Admin table */
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);}
th{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:10px;color:var(--dim);letter-spacing:.4px;}
td.team{text-align:left;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:11px;white-space:nowrap;}
.cell{border-radius:5px;padding:5px 3px;font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;}
.cell.full{background:var(--goodbg);color:var(--good);}
.cell.partial{background:var(--warnbg);color:var(--warn);}
.cell.empty{background:var(--badbg);color:var(--bad);}
.cell small{display:block;font-family:'Inter',sans-serif;font-weight:400;font-size:8px;color:var(--dim);margin-top:1px;}
/* Lock buttons row inside table header */
.lock-th{padding:4px 3px;vertical-align:bottom;}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.pill{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--badbg);color:var(--bad);border-radius:20px;padding:4px 10px;}
.admin-toolbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px;}
/* Modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;}
.mo{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:20px;max-width:400px;width:90%;max-height:80vh;overflow:auto;}
.mo h3{font-family:'Oswald',sans-serif;text-transform:uppercase;margin-top:0;font-size:16px;}
.rr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--panel2);font-family:'JetBrains Mono',monospace;font-size:12px;}
.yes{color:var(--good);}.no{color:var(--dim);}
.hint{color:var(--dim);font-size:12px;margin-top:7px;}
.err{color:var(--bad);font-size:12px;margin-top:7px;}
.li{font-size:28px;text-align:center;margin-bottom:10px;}
.aw{background:var(--badbg);border:1px solid var(--bad);border-radius:7px;padding:7px 12px;font-size:12px;color:var(--bad);margin-top:7px;}
</style>
</head>

function getCW(){
  var n=new Date();
  if(n<SEASON_START)return 1;
  var d=Math.floor((n-SEASON_START)/86400000);
  return Math.min(Math.max(Math.floor(d/7)+1,1),TOTAL_WEEKS);
}
var CW=getCW();
var state={user:null,admin:false,pending:null,week:CW,sel:new Set(),init:false,initWk:null,tries:0,cache:{},locks:{}};
var app=document.getElementById('app');

async function h256(s){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
}

function jsonp(p){
  return new Promise(function(res,rej){
    var cb='ff_'+Math.random().toString(36).slice(2);
    var url=API_URL+'?callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(p));
    window[cb]=function(d){delete window[cb];if(sc.parentNode)document.body.removeChild(sc);res(d);};
    var sc=document.createElement('script');
    sc.src=url;
    sc.onerror=function(){delete window[cb];if(sc.parentNode)document.body.removeChild(sc);rej(new Error('failed'));};
    document.body.appendChild(sc);
  });
}
async function api(p){return jsonp(p);}

async function rGet(mgr,wk){
  var k=mgr+':'+wk;
  if(state.cache[k]!==undefined)return state.cache[k];
  try{
    var r=await api({action:'getRoster',manager:mgr,week:wk});
    var v=(r.success&&r.reps&&r.reps.length>0)?{reps:r.reps,submittedAt:r.submittedAt}:null;
    state.cache[k]=v;return v;
  }catch(e){return null;}
}
async function rSet(mgr,wk,data){
  state.cache[mgr+':'+wk]=data;
  var r=await api({action:'saveRoster',manager:mgr,week:wk,reps:data.reps,submittedAt:data.submittedAt});
  if(!r.success)throw new Error(r.error||'Save failed');
}
async function allR(){
  try{var r=await api({action:'getAllRosters'});return r.success?r.rosters:{};}
  catch(e){return {};}
}
async function getLocks(){
  try{var r=await api({action:'getLocks'});return r.success?r.locks:{};}
  catch(e){return {};}
}
async function setLock(wk,locked){
  try{
    var r=await api({action:'setLock',week:wk,locked:locked});
    if(r.success){state.locks[String(wk)]=locked;return true;}
    return false;
  }catch(e){return false;}
}

function isWeekLocked(wk){return state.locks[String(wk)]===true;}

async function render(){
  if(!state.user&&!state.pending){rLogin();return;}
  if(state.pending){rPin();return;}
  if(state.admin){await rAdmin();return;}
  await rMgr();
}

/* ---- LOGIN ---- */
function rLogin(){
  var all=MGR.concat(['ADMIN']).sort();
  app.innerHTML='<div class="lw"><div class="lb">'+
    '<div class="ll">'+
    '<img src="'+LOGO+'" alt="FF"/>'+
    '<h1>Carrier Fantasy Freight 2026</h1>'+
    '<div class="sub">Weekly roster submissions</div>'+
    '</div>'+
    '<div class="card">'+
    '<label>Your Arrive User Code</label>'+
    '<select id="ls"><option value="">-- select --</option>'+
    all.map(function(m){return '<option value="'+m+'">'+m+(m==='ADMIN'?' (admin)':'')+'</option>';}).join('')+
    '</select>'+
    '<div class="login-continue"><button class="btn" id="lb2">Continue</button></div>'+
    '<div class="login-hint">Need a roster change after submission? Contact LCDOWNING.</div>'+
    '</div></div></div>';
  document.getElementById('lb2').onclick=function(){
    var v=document.getElementById('ls').value;if(!v)return;
    state.pending=v;state.tries=0;render();
  };
}

/* ---- PIN ---- */
function rPin(){
  var isAdm=state.pending==='ADMIN',lk=state.tries>=5;
  app.innerHTML='<div class="lw"><div class="lb">'+
    '<div class="ll"><img src="'+LOGO+'" alt="FF" style="width:80px;height:80px;"/></div>'+
    '<div class="card">'+
    '<div class="li">'+(isAdm?'&#128274;':'&#127944;')+'</div>'+
    '<h2 style="font-family:Oswald,sans-serif;text-align:center;text-transform:uppercase;margin:0 0 8px;">Enter PIN</h2>'+
    '<p style="color:var(--dim);font-size:13px;text-align:center;margin:0 0 14px;">Signing in as <strong style="color:var(--accent)">'+state.pending+'</strong></p>'+
    (lk?'<div class="aw">Too many attempts &mdash; refresh and try again.</div>':
      '<label>PIN</label>'+
      '<input type="password" id="pi" maxlength="20" placeholder="&bull;&bull;&bull;&bull;" autocomplete="off" style="font-size:22px;text-align:center;letter-spacing:6px;"/>'+
      '<div class="err" id="pe" style="display:none;"></div>'+
      (state.tries>0?'<div class="aw">'+state.tries+' failed. '+(5-state.tries)+' remaining.</div>':'')+
      '<div class="row"><button class="btn ghost" id="cb2">Back</button><div style="flex:1"></div><button class="btn" id="sb">Unlock</button></div>'
    )+'</div></div></div>';
  if(lk)return;
  var pi=document.getElementById('pi');pi.focus();
  document.getElementById('cb2').onclick=function(){state.pending=null;state.tries=0;render();};
  var go=async function(){
    var v=pi.value.trim();if(!v)return;
    var h=await h256(v);
    var ok=state.pending==='ADMIN'?h===ADMIN_HASH:h===MPH[state.pending];
    if(ok){
      state.user=state.pending;state.admin=state.pending==='ADMIN';
      state.pending=null;state.tries=0;state.week=CW;state.init=false;
      // Show loading immediately so user knows PIN was accepted
      app.innerHTML='<div class="lw"><div class="lb"><div class="ll"><img src="'+LOGO+'" alt="FF" style="width:80px;height:80px;"/><h1 style="font-family:Oswald,sans-serif;font-size:20px;text-transform:uppercase;margin:12px 0 4px;">Loading...</h1><div class="sub" style="color:var(--dim);">Fetching your roster data</div></div></div></div>';
      state.locks=await getLocks();
      render();
    } else {
      state.tries++;
      var pe=document.getElementById('pe');pe.style.display='block';
      pe.textContent=state.tries>=5?'Too many attempts.':'Incorrect PIN &mdash; '+(5-state.tries)+' remaining.';
      pi.value='';if(state.tries>=5)render();else pi.focus();
    }
  };
  document.getElementById('sb').onclick=go;
  document.getElementById('pi').onkeydown=function(e){if(e.key==='Enter')go();};
}

function lbtn(){return '<button class="btn ghost sm" id="lob">Switch user</button>';}
function bndL(){
  var b=document.getElementById('lob');
  if(b)b.onclick=function(){state.user=null;state.admin=false;state.pending=null;state.init=false;state.tries=0;state.cache={};state.locks={};render();};
}
function brandHtml(sub){
  return '<div class="brand"><img src="'+LOGO+'" alt="FF"/><div><h1>Carrier Fantasy Freight 2026</h1><div class="sub">'+sub+'</div></div></div>';
}

/* ---- MANAGER ---- */
async function rMgr(){
  var mgr=state.user,reps=RBM[mgr]||[],wk=state.week;
  var isSmall=reps.length<=SMALL_THRESHOLD;
  var weekLocked=isWeekLocked(wk);
  // Preload all rosters into cache in one batch call if not already loaded
  var cacheKeys=Object.keys(state.cache).filter(function(k){return k.indexOf(mgr+':')===0;});
  if(cacheKeys.length<TOTAL_WEEKS){
    try{
      var allData=await allR();
      for(var w2=1;w2<=TOTAL_WEEKS;w2++){
        var ck2=mgr+':'+w2;
        if(state.cache[ck2]===undefined){
          var wd2=allData[mgr]&&(allData[mgr][w2]||allData[mgr][String(w2)]);
          state.cache[ck2]=wd2&&wd2.reps&&wd2.reps.length>0?wd2:null;
        }
      }
    }catch(e){}
  }

  var tabs='';
  for(var w=1;w<=TOTAL_WEEKS;w++){
    var wlk=isWeekLocked(w);
    var dot=w===CW&&!wlk?'<div style="position:absolute;top:3px;right:5px;width:5px;height:5px;border-radius:50%;background:'+(w===wk?'#1a1206':'var(--accent)')+'"></div>':'';
    var lkIcon=wlk?'<div style="position:absolute;top:2px;right:4px;font-size:8px;">&#128274;</div>':'';
    tabs+='<div class="wt '+(w===wk?'active':'')+(wlk?' locked-wk':'')+'" data-w="'+w+'" style="position:relative;">WK'+w+dot+lkIcon+'</div>';
  }

  app.innerHTML='<div class="wrap">'+
    '<div class="tb">'+brandHtml('Roster submission')+
    '<div style="display:flex;align-items:center;gap:10px;"><div class="who">'+mgr+'</div>'+lbtn()+'</div></div>'+
    // Season progress FIRST
    '<div class="card" id="pc"><div class="hint">Loading...</div></div>'+
    '<div class="wtabs" id="wtabs">'+tabs+'</div>'+
    '<div class="card" id="mc"><div class="hint" style="padding:16px 0;">Loading...</div></div>'+
    '</div>';

  bndL();
  document.querySelectorAll('#wtabs .wt').forEach(function(t){
    t.onclick=function(){state.week=parseInt(t.dataset.w);state.init=false;render();};
  });

  // Load progress first (all weeks)
  var progressCells='';
  for(var pw=1;pw<=TOTAL_WEEKS;pw++){
    var pr=await rGet(mgr,pw);var pn=pr?pr.reps.length:0;
    progressCells+='<div class="pc '+(pn===REQUIRED_PICKS?'full':pn>0?'partial':'empty')+'" title="Week '+pw+': '+pn+'/'+REQUIRED_PICKS+'">'+pw+'</div>';
  }
  var pcEl=document.getElementById('pc');
  if(pcEl)pcEl.innerHTML='<label style="margin-bottom:8px;">Season progress</label><div class="pr">'+progressCells+'</div><div class="hint">Green='+REQUIRED_PICKS+' selected &middot; Yellow=incomplete &middot; Red=not submitted</div>';

  // Load current week roster
  var res=await Promise.all([rGet(mgr,wk),wk>1?rGet(mgr,wk-1):Promise.resolve(null)]);
  var cur=res[0],prev=res[1];
  var lockedReps=new Set();
  if(!isSmall&&prev&&prev.reps)prev.reps.forEach(function(r){lockedReps.add(r);});

  if(!state.init||state.initWk!==wk){state.sel=new Set(cur?cur.reps:[]);state.init=true;state.initWk=wk;}

  var opp=SCH[mgr]&&SCH[mgr][String(wk)]?SCH[mgr][String(wk)]:null;
  var sorted=reps.slice().sort();
  var sc=state.sel.size;

  var chips=sorted.map(function(rep){
    var lk=lockedReps.has(rep)||weekLocked,ck=state.sel.has(rep);
    return '<label class="rc '+(ck?'ck':'')+' '+(lk&&!ck?'lk':weekLocked&&ck?'lk':'')+'">'+
      '<input type="checkbox" data-r="'+rep+'" '+(ck?'checked':'')+' '+(lk?'disabled':'')+'/> '+rep+'</label>';
  }).join('');

  document.getElementById('mc').innerHTML=
    '<div class="matchup">'+(opp?'<b>Week '+wk+'</b> &middot; vs <b>'+opp.opponent+'</b>'+(opp.division&&opp.division.indexOf('RIVALRY')>=0?' <span class="vs">&#9876; RIVALRY</span>':''):'<b>Week '+wk+'</b>')+'</div>'+
    (weekLocked?'<div class="notice bad">&#128274; Week '+wk+' has been locked by admin. Contact LCDOWNING and FSHIMP for changes.</div>':
      '<div class="notice warn">&#9888; Make sure your selections are final before saving &mdash; changes are allowed until the admin locks the week.</div>')+
    (isSmall?'<div class="notice info">&#127919; Small roster exception: the no-repeat rule is waived for your team.</div>':'')+
    (!isSmall&&lockedReps.size>0&&!weekLocked?'<div class="notice dim">Grayed-out reps played Week '+(wk-1)+' and cannot be re-selected.</div>':'')+
    '<div class="rl">'+chips+'</div>'+
    '<div class="cnt '+(sc===REQUIRED_PICKS?'ok':'w')+'">'+sc+' / '+REQUIRED_PICKS+' selected</div>'+
    '<div class="fr"><div>'+(cur?'<span class="hint">Last saved: '+new Date(cur.submittedAt).toLocaleString()+'</span>':'<span class="hint">Not submitted yet</span>')+'<div id="stw"></div></div>'+
    (!weekLocked?'<button class="btn" id="svb" '+(sc!==REQUIRED_PICKS?'disabled':'')+'>Save roster</button>':'')+
    '</div>';

  if(!weekLocked){
    document.querySelectorAll('.rl input').forEach(function(cb){
      cb.onchange=function(){
        var r=cb.dataset.r;if(cb.checked)state.sel.add(r);else state.sel.delete(r);
        var c=document.querySelector('.cnt');c.textContent=state.sel.size+' / '+REQUIRED_PICKS+' selected';c.className='cnt '+(state.sel.size===REQUIRED_PICKS?'ok':'w');
        var b=document.getElementById('svb');if(b)b.disabled=state.sel.size!==REQUIRED_PICKS;
        document.querySelectorAll('.rc').forEach(function(chip){var i=chip.querySelector('input');if(!i.disabled)chip.className='rc '+(i.checked?'ck':'');});
      };
    });
    var svb=document.getElementById('svb');
    if(svb)svb.onclick=async function(){
      svb.disabled=true;svb.textContent='Saving...';
      var ra=Array.from(state.sel),ts=new Date().toISOString();
      setST('p');
      try{
        await rSet(mgr,wk,{reps:ra,submittedAt:ts});
        setST('ok');
        state.cache[mgr+':'+wk]={reps:ra,submittedAt:ts};
      }catch(e){setST('err');}
      svb.disabled=false;svb.textContent='Save roster';
      // refresh progress bar
      var pr2=await rGet(mgr,wk);
      state.cache[mgr+':'+wk]=pr2;
      var pn=pr2?pr2.reps.length:0;
      var pcEl2=document.getElementById('pc');
      if(pcEl2){
        var progressCells2='';
        for(var pw2=1;pw2<=TOTAL_WEEKS;pw2++){var pr3=await rGet(mgr,pw2);var pn2=pr3?pr3.reps.length:0;progressCells2+='<div class="pc '+(pn2===REQUIRED_PICKS?'full':pn2>0?'partial':'empty')+'" title="Week '+pw2+': '+pn2+'/'+REQUIRED_PICKS+'">'+pw2+'</div>';}
        pcEl2.innerHTML='<label style="margin-bottom:8px;">Season progress</label><div class="pr">'+progressCells2+'</div><div class="hint">Green='+REQUIRED_PICKS+' selected &middot; Yellow=incomplete &middot; Red=not submitted</div>';
      }
    };
  }
}

function setST(s){
  var w=document.getElementById('stw');if(!w)return;
  if(s==='p')w.innerHTML='<span class="st p">Saving...</span>';
  else if(s==='ok')w.innerHTML='<span class="st ok">&#10003; Saved</span>';
  else w.innerHTML='<span class="st err">Save failed</span>';
}

/* ---- ADMIN ---- */
async function rAdmin(){
  // Fetch locks and all rosters in parallel
  var parallel=await Promise.all([getLocks(),allR()]);
  state.locks=parallel[0];
  var arPreloaded=parallel[1];
  // Pre-populate cache
  for(var mi2=0;mi2<MGR.length;mi2++){
    var mg2=MGR[mi2];
    for(var w2=1;w2<=TOTAL_WEEKS;w2++){
      var wd2=arPreloaded[mg2]&&(arPreloaded[mg2][w2]||arPreloaded[mg2][String(w2)]);
      state.cache[mg2+':'+w2]=wd2&&wd2.reps&&wd2.reps.length>0?wd2:null;
    }
  }

  app.innerHTML='<div class="wrap">'+
    '<div class="tb">'+brandHtml('Admin &mdash; Submission tracker')+
    '<div style="display:flex;align-items:center;gap:10px;"><div class="who">ADMIN</div>'+lbtn()+'</div></div>'+
    '<div class="admin-toolbar">'+
    '<button class="btn ghost sm" id="ref">&#8635; Refresh</button>'+
    '<button class="btn ghost sm" id="exp">Export CSV</button>'+
    '</div>'+
    '<div class="card" id="pend"><div class="hint">Loading...</div></div>'+
    '<div class="card"><div style="overflow-x:auto;">'+
    '<table><thead>'+
    '<tr><td class="team"></td>'+
    Array.from({length:TOTAL_WEEKS},function(_,i){
      var w=i+1,lk=isWeekLocked(w);
      return '<td class="lock-th"><button class="btn '+(lk?'locked-state':'lock')+'" data-lw="'+w+'" id="lkbtn'+w+'">'+(lk?'&#10003;':'&#128274;')+' WK'+w+'</button></td>';
    }).join('')+
    '</tr>'+
    '<tr><th style="text-align:left;">Team</th>'+
    Array.from({length:TOTAL_WEEKS},function(_,i){return '<th>WK'+(i+1)+'</th>';}).join('')+
    '</tr></thead><tbody id="gb">'+
    '<tr><td colspan="'+(TOTAL_WEEKS+1)+'" style="color:var(--dim);padding:16px;">Loading...</td></tr>'+
    '</tbody></table></div></div>'+
    '<div id="mh"></div></div>';

  bndL();
  document.getElementById('ref').onclick=function(){state.cache={};state.locks={};rAdmin();};

  // Bind lock buttons
  for(var ww=1;ww<=TOTAL_WEEKS;ww++){
    (function(w){
      var btn=document.getElementById('lkbtn'+w);
      if(btn&&!isWeekLocked(w)){
        btn.onclick=async function(){
          btn.disabled=true;btn.textContent='...';
          var ok=await setLock(w,true);
          if(ok){state.cache={};rAdmin();}
          else{btn.disabled=false;btn.innerHTML='&#128274; WK'+w;}
        };
      }
    })(ww);
  }

  var pendingPerWeek={};
  for(var w=1;w<=TOTAL_WEEKS;w++)pendingPerWeek[w]=[];

  var rh='';
  for(var mi=0;mi<MGR.length;mi++){
    var mg=MGR[mi],cells='';
    for(var w=1;w<=TOTAL_WEEKS;w++){
      var rc=state.cache[mg+':'+w],n=rc?rc.reps.length:0;
      if(n<REQUIRED_PICKS)pendingPerWeek[w].push(mg+(n>0?' ('+n+'/'+REQUIRED_PICKS+')':''));
      var op=SCH[mg]&&SCH[mg][String(w)]?SCH[mg][String(w)].opponent:'';
      cells+='<td><div class="cell '+(n===REQUIRED_PICKS?'full':n>0?'partial':'empty')+'" data-m="'+mg+'" data-w="'+w+'">'+n+'/'+REQUIRED_PICKS+'<small>'+op+'</small></div></td>';
    }
    rh+='<tr><td class="team">'+mg+'</td>'+cells+'</tr>';
  }
  document.getElementById('gb').innerHTML=rh;

  var cp=pendingPerWeek[CW]||[];
  document.getElementById('pend').innerHTML=
    '<label>Pending &mdash; Week '+CW+' (current week, starts '+new Date(SEASON_START.getTime()+(CW-1)*7*86400000).toLocaleDateString()+')</label>'+
    (cp.length===0
      ?'<div class="hint" style="color:var(--good);">&#10003; All rosters submitted for Week '+CW+'!</div>'
      :'<div class="pills">'+cp.map(function(m){return '<span class="pill">'+m+'</span>';}).join('')+'</div>');

  document.querySelectorAll('.cell').forEach(function(c){
    c.onclick=async function(){
      var mg=c.dataset.m,w=c.dataset.w,rc=state.cache[mg+':'+w];
      var all=(RBM[mg]||[]).slice().sort(),sel=new Set(rc?rc.reps:[]);
      document.getElementById('mh').innerHTML=
        '<div class="mbg" id="mbg"><div class="mo">'+
        '<h3>'+mg+' &mdash; Week '+w+'</h3>'+
        '<div class="hint" style="margin-bottom:8px;">'+(rc?'Saved: '+new Date(rc.submittedAt).toLocaleString():'Not submitted')+'</div>'+
        all.map(function(rep){return '<div class="rr"><span>'+rep+'</span><span class="'+(sel.has(rep)?'yes':'no')+'">'+(sel.has(rep)?'PLAYS':'&mdash;')+'</span></div>';}).join('')+
        '</div></div>';
      document.getElementById('mbg').onclick=function(e){if(e.target.id==='mbg')document.getElementById('mh').innerHTML='';};
    };
  });

  document.getElementById('exp').onclick=function(){
    var csv='REP,Manager,Week,Plays\n';
    for(var mi=0;mi<MGR.length;mi++){
      var mg=MGR[mi],all=(RBM[mg]||[]).slice().sort();
      for(var w=1;w<=TOTAL_WEEKS;w++){
        var rc=state.cache[mg+':'+w],sel=new Set(rc?rc.reps:[]);
        for(var ri=0;ri<all.length;ri++)csv+=all[ri]+','+mg+','+w+','+(sel.has(all[ri])?'TRUE':'FALSE')+'\n';
      }
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='fantasy_freight.csv';a.click();
  };
}

render();
</script>
</body>
</html>
